name: Build Windows

# Gera o executável Windows (pasta zipada + .exe portátil) num runner Windows,
# sem depender do Mac. Disparo SEMPRE manual (Actions > Build Windows > Run
# workflow) — não roda mais sozinho quando uma Release é publicada.
# Informe "tag" para anexar os artefatos a uma Release existente; deixe em
# branco para só gerar os artefatos (baixáveis na aba Actions do run).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da Release para anexar os artefatos (ex: v2.3.0). Vazio = não anexa."
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Testes
        run: npm test

      - name: Ler versão
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build estático + empacotar (zip e portátil)
        run: |
          npm run build
          npx electron-builder --win zip portable --x64

      - uses: actions/upload-artifact@v4
        with:
          name: EngSched-Timeline-v${{ steps.version.outputs.version }}-windows
          path: |
            dist/*.zip
            dist/*.exe
          if-no-files-found: error

      - name: Anexar à Release
        if: ${{ inputs.tag != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" dist/*.zip dist/*.exe --clobber
